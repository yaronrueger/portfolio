image: node:22-alpine

stages:
  - check
  - build

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.install:
  before_script:
    - npm ci --no-audit --no-fund

check:
  stage: check
  extends: .install
  script:
    - npm run check
    - npm run format:check

build:
  stage: build
  extends: .install
  script:
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 week
